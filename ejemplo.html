<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SabaGo - Ejemplo Header Responsive</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Poppins", sans-serif;
    background: #f7f7f7;
  }

  /* --- Header --- */
  header {
    background-color: #ffb400;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 25px;
    position: sticky;
    top: 0;
    z-index: 1000;
  }

  header h1 {
    font-size: 22px;
    margin: 0;
  }

  nav {
    display: flex;
    gap: 20px;
  }

  nav a {
    color: white;
    text-decoration: none;
    font-weight: 500;
    transition: 0.3s;
  }

  nav a:hover {
    opacity: 0.8;
  }

  /* --- Menú hamburguesa --- */
  .menu-btn {
    display: none;
    flex-direction: column;
    cursor: pointer;
    gap: 5px;
  }

  .menu-btn div {
    width: 25px;
    height: 3px;
    background: white;
    border-radius: 2px;
    transition: all 0.3s;
  }

  /* --- Responsivo --- */
  @media (max-width: 768px) {
    nav {
      display: none;
      position: absolute;
      top: 60px;
      left: 0;
      width: 100%;
      background: #ffb400;
      flex-direction: column;
      text-align: center;
      padding: 15px 0;
      gap: 10px;
    }

    nav.active {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    .menu-btn {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }
</style>
</head>
<body>

  <header>
    <h1>🚴‍♂️ SabaGo</h1>
    <nav id="menu">
      <a href="inicio.html">Inicio</a>
      <a href="cliente.html">Cliente</a>
      <a href="mis_pedidos.html">Mis pedidos</a>
      <a href="login.html">Salir</a>
    </nav>

    <!-- Botón menú hamburguesa -->
    <div class="menu-btn" id="menu-btn">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </header>

  <main style="padding: 30px;">
    <h2>Bienvenido a SabaGo</h2>
    <p>Este es un ejemplo del header con menú hamburguesa responsivo. Prueba reducir la ventana 👇</p>
  </main>

  <script>
    const menuBtn = document.getElementById("menu-btn");
    const menu = document.getElementById("menu");

    menuBtn.addEventListener("click", () => {
      menu.classList.toggle("active");
      menuBtn.classList.toggle("open");
    });
  </script>

</body>
</html>
